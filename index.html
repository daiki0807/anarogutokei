<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アナログ時計学習アプリ</title>
    <!-- 読みやすいフォント(Outfit)をインポート -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>とけいであそぼう</h1>
            <p>はりをうごかして、じかんをあわせてみよう</p>
        </header>

        <main>
            <div class="clock-wrapper">
                <div class="clock" id="clock">
                    <!-- 時計の目盛りや数字はJavaScriptで生成します -->
                    <div class="clock-face" id="clock-face"></div>
                    
                    <!-- 針 -->
                    <div class="hand hour-hand" id="hour-hand">
                        <div class="hand-body"></div>
                        <!-- タッチ領域を広げるための不可視要素 -->
                        <div class="touch-area"></div>
                    </div>
                    <div class="hand minute-hand" id="minute-hand">
                        <div class="hand-body"></div>
                        <div class="touch-area"></div>
                    </div>
                    
                    <!-- 中央のピン -->
                    <div class="center-pin"></div>
                </div>
            </div>

            <div class="digital-display">
                <div class="time-box">
                    <span id="digital-hour" class="digital-text hour-text">12</span>
                    <span class="colon">:</span>
                    <span id="digital-minute" class="digital-text minute-text">00</span>
                </div>
                <div class="time-label">
                    <span class="label-hour">じ</span>
                    <span class="label-minute">ふん</span>
                </div>
            </div>
            
            <div class="controls">
                <button id="btn-current-time" class="primary-btn">いまのじかん</button>
                <button id="btn-reset" class="secondary-btn">12じにする</button>
                <button id="btn-toggle-minute-guide" class="secondary-btn">ふんのガイド</button>
                <button id="btn-calc-mode" class="primary-btn calc-btn">じかんのけいさん</button>
            </div>
        </main>
    </div>

    <!-- 計算モードのモーダル -->
    <div id="calc-modal" class="modal hidden">
        <div class="modal-content">
            <button id="btn-close-modal" class="close-btn">&times;</button>
            <h2>じかんのけいさん</h2>
            
            <div class="calc-tabs">
                <button class="calc-tab active" id="tab-duration">〇分後（前）</button>
                <button class="calc-tab" id="tab-endtime">何分かかった？</button>
            </div>
            
            <div class="calc-controls">
                <p class="calc-label"><span id="calc-start-label-prefix">いまのじかん: </span><span id="calc-start-time">12時00分</span></p>
                <div class="duration-controls-panel">
                    <div class="duration-controls-row top-row">
                        <button class="dur-btn time-btn hidden" data-val="-60">-1時間</button>
                        
                        <div class="duration-display" id="display-duration">
                            <span id="calc-duration">0</span>分
                        </div>
                        <div class="duration-display hidden" id="display-endtime">
                            <span style="font-size: 0.9rem; color: #666;">ゴール</span><br>
                            <span id="calc-end-time-display">12時00分</span>
                        </div>
                        
                        <button class="dur-btn time-btn hidden" data-val="60">+1時間</button>
                    </div>
                    
                    <div class="duration-controls-row bottom-row">
                        <div class="btn-group-half">
                            <button class="dur-btn" data-val="-10">-10分</button>
                            <button class="dur-btn" data-val="-5">-5分</button>
                            <button class="dur-btn" data-val="-1">-1分</button>
                        </div>
                        <div class="btn-group-half">
                            <button class="dur-btn" data-val="1">+1分</button>
                            <button class="dur-btn" data-val="5">+5分</button>
                            <button class="dur-btn" data-val="10">+10分</button>
                        </div>
                    </div>
                </div>
                <button id="btn-show-calc" class="primary-btn">図をひょうじする</button>
            </div>

            <div id="calc-result" class="calc-result hidden">
                <div class="diagram-container">
                    <div class="diagram-start">
                        <div class="mini-clock" id="diagram-start-clock">
                            <div class="mini-clock-face"></div>
                            <div class="hand hour-hand" id="start-hour-hand"><div class="hand-body"></div></div>
                            <div class="hand minute-hand" id="start-minute-hand"><div class="hand-body"></div></div>
                            <div class="center-pin"></div>
                        </div>
                    </div>
                    <div class="diagram-timeline" id="diagram-timeline">
                        <!-- JSで動的にタイムラインを描画 -->
                    </div>
                    <div class="diagram-end">
                        <div class="mini-clock" id="diagram-end-clock">
                            <div class="mini-clock-face"></div>
                            <div class="hand hour-hand" id="end-hour-hand"><div class="hand-body"></div></div>
                            <div class="hand minute-hand" id="end-minute-hand"><div class="hand-body"></div></div>
                            <div class="center-pin"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
